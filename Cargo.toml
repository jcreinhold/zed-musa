[package]
authors = ["Jacob Reinhold"]
description = "musa extension for Zed"
edition = "2024"
license = "Apache-2.0"
name = "zed-musa"
publish = false
version = "0.1.0"

# Exclude from any parent workspace (Zed extensions build standalone).
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
zed_extension_api = "0.7.0"

[profile.release]
lto = true
opt-level = "z"
strip = true
