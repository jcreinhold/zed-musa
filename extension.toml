authors = ["Jacob Reinhold"]
description = "Language support for musa — the notation-first music language"
id = "musa"
name = "musa"
repository = "https://github.com/jcreinhold/zed-musa"
schema_version = 1
version = "0.1.0"

# The grammar is Musa's committed tree-sitter artifact, pinned by rev; the
# queries under languages/musa/ are written against its committed node names.
# This revision includes dependent type indices, current declarations and
# quotation forms, and `performance` as a module path segment.
[grammars.musa]
path = "editors/tree-sitter-musa"
repository = "file:///Users/jcreinhold/Code/musa"
rev = "f38b1689a223a64056d1950df80826f2abc803c3"

[language_servers.musa-lsp]
languages = ["musa"]
name = "musa language server"
